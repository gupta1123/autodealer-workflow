[build]
command = "npm run build:web"
publish = "apps/web/.next-build"

[build.environment]
NODE_VERSION = "24"
NPM_VERSION = "11"

[context.production.environment]
NEXT_PUBLIC_TEAM_ACCESS_ENFORCEMENT = "true"

[[plugins]]
package = "./netlify/plugins/api-proxy"

[[plugins]]
package = "@netlify/plugin-nextjs"
